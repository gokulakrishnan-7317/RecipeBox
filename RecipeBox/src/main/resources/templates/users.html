<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecipeBox - Users</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="topbar"><div class="brand">RECIPEBOX<small>PERSONAL RECIPE & MEAL PLANNER</small></div><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/recipes">Recipes</a><a href="/meals">Meal Planner</a><a href="/shopping">Shopping List</a><a class="active" href="/users">Users</a></nav></header><main class="container"><div class="page-head"><div><p class="eyebrow">USER MANAGEMENT</p><h1>Users</h1><p>Store the home-cook or hostel-resident profile linked to recipes and meal plans.</p></div></div><section class="two-col"><div class="card"><h3>Add User</h3><form method="post" action="/users/save"><div class="form-group"><label>Full name *</label><input name="name" required placeholder="Your name"></div><div class="form-group"><label>Email *</label><input name="email" type="email" required placeholder="name@example.com"></div><button class="btn primary" type="submit">Create User</button></form></div><div class="card table-card"><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th></tr></thead><tbody><tr th:each="u:${users}"><td th:text="${u.id}">1</td><td th:text="${u.name}">Gokul</td><td th:text="${u.email}">email</td></tr></tbody></table></div></div></section></main></body></html>
