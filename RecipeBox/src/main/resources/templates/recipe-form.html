<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecipeBox - Recipe Form</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="topbar"><div class="brand">RECIPEBOX<small>PERSONAL RECIPE & MEAL PLANNER</small></div><nav class="nav"><a href="/dashboard">Dashboard</a><a class="active" href="/recipes">Recipes</a><a href="/meals">Meal Planner</a><a href="/shopping">Shopping List</a><a href="/users">Users</a></nav></header><main class="container"><div class="page-head"><div><p class="eyebrow">RECIPE EDITOR</p><h1 th:text="${recipe.id == null ? 'Add Recipe' : 'Edit Recipe'}">Add Recipe</h1><p>Store ingredients, steps and preparation information in MySQL.</p></div></div><form class="card form-card" method="post" action="/recipes/save"><input type="hidden" name="id" th:value="${recipe.id}"><div class="grid2"><div class="form-group"><label>Recipe title *</label><input name="title" required th:value="${recipe.title}" placeholder="Chicken Biryani"></div><div class="form-group"><label>Cuisine</label><input name="cuisine" th:value="${recipe.cuisine}" placeholder="Indian"></div><div class="form-group"><label>Prep time (minutes)</label><input type="number" min="0" name="prepTime" th:value="${recipe.prepTime}" placeholder="30"></div><div class="form-group"><label>Servings</label><input type="number" min="1" name="servings" th:value="${recipe.servings}" placeholder="2"></div><div class="form-group"><label>Owner</label><select name="userId"><option value="">-- Optional --</option><option th:each="u:${users}" th:value="${u.id}" th:selected="${recipe.user != null && recipe.user.id == u.id}" th:text="${u.name + ' (' + u.email + ')'}">User</option></select></div><div class="form-group" style="display:flex;align-items:end"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="favorite" value="true" th:checked="${recipe.favorite}"> Mark as favorite</label></div></div><div class="form-group"><label>Description</label><textarea name="description" placeholder="Short description" th:text="${recipe.description}"></textarea></div><div class="form-group"><label>Preparation steps *</label><textarea name="instructions" required placeholder="1. ...&#10;2. ..." th:text="${recipe.instructions}"></textarea></div><div class="ingredient-head"><h3>Ingredients</h3><button type="button" class="btn secondary" onclick="addIngredient()">+ Add ingredient</button></div><div id="ingredients"><div class="ingredient-row" th:each="i:${recipe.ingredients}"><input name="ingredientName" required th:value="${i.name}" placeholder="Ingredient"><input type="number" step="0.01" min="0" name="ingredientQuantity" th:value="${i.quantity}" placeholder="Qty"><input name="ingredientUnit" th:value="${i.unit}" placeholder="unit"><button type="button" class="icon-btn remove" onclick="this.parentElement.remove()">Remove</button></div><div class="ingredient-row" th:if="${#lists.isEmpty(recipe.ingredients)}"><input name="ingredientName" required placeholder="Ingredient"><input type="number" step="0.01" min="0" name="ingredientQuantity" value="1" placeholder="Qty"><input name="ingredientUnit" placeholder="unit"><button type="button" class="icon-btn remove" onclick="this.parentElement.remove()">Remove</button></div></div><div class="form-actions"><a class="btn secondary" href="/recipes">Cancel</a><button class="btn primary" type="submit">Save Recipe</button></div></form></main><script>function addIngredient(){const row=document.createElement('div');row.className='ingredient-row';row.innerHTML='<input name="ingredientName" required placeholder="Ingredient"><input type="number" step="0.01" min="0" name="ingredientQuantity" value="1" placeholder="Qty"><input name="ingredientUnit" placeholder="unit"><button type="button" class="icon-btn remove" onclick="this.parentElement.remove()">Remove</button>';document.getElementById('ingredients').appendChild(row);}</script></body></html>
