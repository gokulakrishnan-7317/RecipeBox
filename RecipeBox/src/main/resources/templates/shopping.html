<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecipeBox - Shopping List</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="topbar"><div class="brand">RECIPEBOX<small>PERSONAL RECIPE & MEAL PLANNER</small></div><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/recipes">Recipes</a><a href="/favorites">Favorites</a><a href="/meals">Meal Planner</a><a class="active" href="/shopping">Shopping List</a><a href="/users">Users</a></nav></header><main class="container"><div class="page-head"><div><p class="eyebrow">CONSOLIDATED SHOPPING LIST</p><h1>Shopping List</h1><p>Quantities are aggregated across recipes planned in the selected week.</p></div></div><div class="card" style="margin-bottom:18px"><form class="grid2" method="get"><div class="form-group"><label>From</label><input type="date" name="from" th:value="${from}"></div><div class="form-group"><label>To</label><input type="date" name="to" th:value="${to}"></div><div><button class="btn primary" type="submit">Generate List</button></div></form></div><div class="card"><div th:if="${#maps.isEmpty(items)}" class="empty">No ingredients found for the selected meal-plan dates.</div><div th:unless="${#maps.isEmpty(items)}"><div class="shop-row" th:each="entry:${items}"><b th:text="${entry.key}">Rice</b><span><span th:each="unit:${entry.value}" th:text="${#numbers.formatDecimal(unit.value,1,2)} + ' ' + (unit.key == '' ? '' : unit.key) + ' '" >2 cups</span></span></div></div></div></main></body></html>
