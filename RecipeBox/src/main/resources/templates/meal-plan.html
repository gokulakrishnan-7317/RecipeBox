<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecipeBox - Meal Planner</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="topbar"><div class="brand">RECIPEBOX<small>PERSONAL RECIPE & MEAL PLANNER</small></div><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/recipes">Recipes</a><a class="active" href="/meals">Meal Planner</a><a href="/shopping">Shopping List</a><a href="/users">Users</a></nav></header><main class="container"><div class="page-head"><div><p class="eyebrow">WEEKLY MEAL CALENDAR</p><h1>Meal Planner</h1><p>Every meal must link to an existing recipe.</p></div></div><div class="card form-card" style="max-width:none;margin-bottom:22px"><form class="grid2" method="post" action="/meals/save"><div class="form-group"><label>Date *</label><input type="date" name="mealDate" required th:value="${weekStart}"></div><div class="form-group"><label>Meal type *</label><select name="mealType" required><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></div><div class="form-group"><label>Recipe *</label><select name="recipeId" required><option value="">Select existing recipe</option><option th:each="r:${recipes}" th:value="${r.id}" th:text="${r.title + ' — ' + (r.cuisine ?: 'General')}">Recipe</option></select></div><div class="form-group"><label>User</label><select name="userId"><option value="">No owner</option><option th:each="u:${users}" th:value="${u.id}" th:text="${u.name}">User</option></select></div><div class="form-actions" style="grid-column:1/-1"><button class="btn primary" type="submit">+ Add to Meal Plan</button></div></form></div><div class="calendar" th:if="${not #lists.isEmpty(meals)}"><div class="day" th:each="m:${meals}"><h4 th:text="${#temporals.format(m.mealDate,'EEE, dd MMM') + ' • ' + m.mealType}">Mon</h4><div class="meal"><b th:text="${m.recipe.title}">Recipe</b><small th:text="${m.recipe.cuisine}">Cuisine</small><form th:action="@{'/meals/delete/' + ${m.id}}" method="post" style="margin-top:7px"><button class="action danger-text" style="border:0;background:none;padding:0;cursor:pointer">Remove</button></form></div></div></div><div class="card empty" th:if="${#lists.isEmpty(meals)}">No meals planned yet. Use the form above to build your week.</div></main></body></html>
